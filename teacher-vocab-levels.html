<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Vocab Levels | Enguistics Teacher Console</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="teacher-vocab-levels.css?v=20261015-grammar-levels-1">
</head>
<body>
  <main class="shell">
    <section id="login-view" class="login-view" aria-labelledby="login-title">
      <div class="brand"><span class="brand-mark">E</span><div><span class="eyebrow">ENGUISTICS // TEACHER SYSTEM</span><h1 id="login-title">Vocab Levels</h1></div></div>
      <p class="intro">手動調整 Battleship VS AI 詞彙 Level。儲存後，遊戲會按新 Level 重新排列 stages。</p>
      <form id="login-form" class="login-form">
        <label>Teacher ID<input id="login-id" type="text" autocomplete="username" autocapitalize="characters" required></label>
        <label>PIN<input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" maxlength="8" required></label>
        <button id="login-button" class="button primary" type="submit">LOGIN</button>
      </form>
      <div id="login-status" class="status" role="status">Connecting to teacher system...</div>
      <a class="back-link" href="/teacher-vocab">返回 Teacher Vocab</a>
    </section>

    <section id="workspace" class="workspace hidden" aria-label="Vocabulary level editor">
      <header class="topbar">
        <div class="brand"><span class="brand-mark compact">E</span><div><span class="eyebrow">ENGUISTICS // BATTLESHIP</span><h1>Vocab Levels</h1></div></div>
        <div class="account"><span id="account-label">--</span><button id="refresh-button" class="button icon" type="button" title="Refresh" aria-label="Refresh">&#8635;</button><button id="logout-button" class="button secondary" type="button">LOGOUT</button></div>
      </header>
      <div class="notice">只會改 VS AI 嘅分級；同一英文詞如果有不同意思／詞性，會分開列出。</div>
      <div class="toolbar">
        <label class="search"><span class="sr-only">Search vocabulary</span><input id="search-input" type="search" placeholder="搜尋英文、中文、詞性或 Level" autocomplete="off"></label>
        <select id="level-filter" aria-label="Filter by level"><option value="">ALL LEVELS</option><option value="L1">LEVEL 1</option><option value="L2">LEVEL 2</option><option value="L3">LEVEL 3</option><option value="L4">LEVEL 4</option><option value="L5">LEVEL 5</option><option value="L5_STAR">LEVEL 5*</option></select>
        <span id="result-count" class="result-count">0 entries</span>
      </div>
      <div id="save-status" class="save-status" role="status"></div>
      <div id="entry-list" class="entry-list"></div>
      <div class="pagination"><button id="previous-page" class="button secondary" type="button">PREVIOUS</button><span id="page-label">1 / 1</span><button id="next-page" class="button secondary" type="button">NEXT</button></div>
      <a class="back-link workspace-back-link" href="/teacher-vocab">返回 Teacher Vocab</a>
    </section>
  </main>
  <script src="teacher-vocab-level-contract.js?v=20261015-grammar-levels-1"></script>
  <script src="teacher-vocab-level-data.js?v=20261015-grammar-levels-1"></script>
  <script type="module" src="teacher-vocab-levels.js?v=20261015-grammar-levels-1"></script>
</body>
</html>
