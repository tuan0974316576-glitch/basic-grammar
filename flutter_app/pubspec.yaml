name: dope_english
description: DOPE ENGLISH Flutter migration shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/lesson_01.json
    - assets/data/lesson_02.json
    - assets/data/quiz_01.json
    - assets/data/vocab/
    - assets/audio/sfx/
    - assets/audio/vocab_words/v1/
    - assets/fonts/OFL-ChironGoRoundTC.txt
  fonts:
    - family: ChironGoRoundTC
      fonts:
        - asset: assets/fonts/ChironGoRoundTC-Variable.ttf
