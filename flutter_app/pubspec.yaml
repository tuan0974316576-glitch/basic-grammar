name: dope_english
description: DOPE ENGLISH Flutter migration shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_functions: ^6.3.6
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/vocab/
    - assets/audio/sfx/
    - assets/audio/verb_table/v1/
    - assets/audio/vocab_words/v1/
    - assets/grammar-verbs/irasutoya/v1/
    - assets/fonts/OFL-Chiron-GoRound-TC.md
  fonts:
    - family: ChironGoRoundTC
      fonts:
        - asset: assets/fonts/ChironGoRoundTCVF.ttf
