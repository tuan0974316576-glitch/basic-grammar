name: dope_english
description: A1 BUDDY Flutter learning app.
publish_to: none
version: 0.1.1+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  flutter_soloud: ^4.1.7
  shared_preferences: ^2.5.3
  firebase_core: 4.13.0
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.5.7
  cloud_functions: ^6.3.6
  firebase_storage: ^13.1.0
  file_picker: ^10.3.10
  image_picker: ^1.2.0
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  lottie: ^3.3.2
  connectivity_plus: ^7.0.0
  record: ^7.1.1
  firebase_messaging: 16.5.0
  dicebear_core: ^10.7.0
  dicebear_styles: ^10.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/econ-question-visuals/
    - assets/data/vocab/
    - assets/audio/sfx/
    - assets/audio/verb_table/v1/
    - assets/audio/vocab_words/v1/
    - assets/setting-2.png
    - assets/dumbbel.png
    - assets/lottie/
    - assets/lottie/monsters/
    - assets/lottie/monsters/
    - assets/branding/
    - assets/grammar-verbs/irasutoya/v1/
    - assets/grammar-verbs/teacher/v1/
    - assets/fonts/OFL-Chiron-GoRound-TC.md
  fonts:
    - family: ChironGoRoundTC
      fonts:
        - asset: assets/fonts/ChironGoRoundTCVF.ttf
